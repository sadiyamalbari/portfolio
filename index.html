    }

      color: #1f2937;
      font-size: 1.2rem;
      font-weight: bold;
      border: 5px solid #f59e0b;
    }

    section {
      padding: 70px 0;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 25px;
      color: #111827;
    }

    .about,
    .projects,
    .contact {
      background: white;
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
